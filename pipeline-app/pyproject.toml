[project]
name = "pipeline-app"
version = "0.1.0"
description = "Web app: video → ffmpeg → COLMAP → OpenSplat → SuperSplat Viewer"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.7",
    "pydantic>=2.5",
]

[project.optional-dependencies]
queue = [
    "celery[redis]>=5.3",
    "redis>=5.0",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]